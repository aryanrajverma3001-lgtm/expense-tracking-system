<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Expense Tracking System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-bg">

    <div class="container-fluid py-4">

        <!-- Page Title -->
        <h1 class="text-center fw-bold text-white mb-2">Expense Tracking System</h1>

        <!-- Logout Button -->
        <div class="text-center mb-4">
            <button onclick="logout()" class="btn btn-danger fw-semibold px-4">Logout</button>
        </div>

        <div class="row px-4">

            <!-- LEFT PANEL -->
            <div class="col-md-3">
                <div class="card p-4 mb-4 shadow-lg dashboard-card">

                    <h5 class="fw-bold mb-3">Add Budget</h5>
<input type="number" id="budgetInput" class="form-control mb-2" placeholder="Enter Budget">

<button class="btn btn-primary w-100 mb-4" onclick="saveBudget()">Save Budget</button>

                    <h5 class="fw-bold mb-3">Add Expense</h5>

                    <input type="text" id="title" class="form-control mb-2" placeholder="Expense Title">
                    <input type="number" id="amount" class="form-control mb-2" placeholder="Amount">
                    <select id="category" class="form-select mb-3">
                        <option selected disabled>Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Groceries">Groceries</option>
                        <option value="Education">Education</option>    
                        <option value="Other">Other</option>
                    </select>


                    <button class="btn btn-primary w-100 mb-2" onclick="addExpense()">Add Expense</button>

                    <!-- Filter Section -->
                    <h6 class="fw-bold mt-4 mb-2">Filter by Category</h6>
                    <select id="filterCategory" class="form-select mb-3" onchange="applyFilters()">
                        <option>All</option>
                        <option>Food</option>
                        <option>Travel</option>
                        <option>Shopping</option>
                        <option>Health</option>
                        <option>Other</option>
                    </select>

                </div>
            </div>

            <!-- MIDDLE PANEL -->
            <div class="col-md-6">

                <!-- SUMMARY BOXES -->
<div class="row text-center mb-4">
    <div class="col">
        <div class="summary-box shadow-sm">
            Total Budget: <span id="totalBudget">0</span>
        </div>
    </div>

    <div class="col">
        <div class="summary-box shadow-sm">
            Total Expenses: <span id="totalExpenses">0</span>
        </div>
    </div>

    <div class="col">
        <div class="summary-box shadow-sm">
            Budget Left: <span id="budgetLeft">0</span>
        </div>
    </div>
</div>


                <!-- WHITE EXPENSE LIST TABLE -->
                <div class="card p-3 shadow-lg">

                    <h5 class="fw-bold mb-3">Expense History</h5>

                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead class="table-light">
                                <tr>
                                    <th>Title</th>
                                    <th>Amount</th>
                                    <th>Category</th>
                                    <th>Date</th>
                                    <th>Action</th>
                                </tr>
                            </thead>

                            <tbody id="expenseTable">
                                <!-- JS inserts rows here -->
                            </tbody>
                        </table>
                    </div>

                </div>

            </div>

            <!-- RIGHT PANEL -->
            <div class="col-md-3">

                <div class="card p-3 shadow-lg mb-4 dashboard-card">
                    <h6 class="fw-bold">Expenses Breakdown</h6>
                    <canvas id="expenseChart" height="220"></canvas>
                </div>

                <div class="card p-3 shadow-lg dashboard-card">
                    <h6 class="fw-bold">Expenses Overview</h6>
                    <canvas id="barChart" height="220"></canvas>
                </div>

            </div>

        </div>
    </div>

    <!-- Firebase + Auth -->
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/auth.js"></script>

    <!-- Dashboard Logic -->
    <script type="module" src="js/dashboard.js"></script>

    <!-- Charts Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>

</html>
