<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Expense Tracking System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-bg">

    <div class="container d-flex justify-content-center align-items-center vh-100">

        <!-- LOGIN CARD -->
        <div class="login-card shadow-lg p-5 bg-white rounded-4">

            <!-- TABS -->
            <div class="d-flex justify-content-center mb-3 gap-4">
                <a class="login-tab active-tab">Login</a>
                <a class="login-tab" href="register.html">Register</a>
            </div>

            <!-- LOGIN FORM -->
            <div>
                <div class="mb-3">
                    <input type="email" id="loginEmail" placeholder="Email" class="form-control login-input">
                </div>

                <div class="mb-4">
                    <input type="password" id="loginPassword" placeholder="Password" class="form-control login-input">
                </div>

                <button onclick="login()" type="button" class="btn btn-success w-100 py-2 fw-semibold">
                    Login
                </button>
            </div>

        </div>

    </div>

    <!-- Firebase Auth Logic -->
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/auth.js"></script>


</body>

</html>
